name: Update anime list

on:
  schedule:
    # 15:00 UTC = 22:00 Vietnam time
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install card rendering dependencies
        run: |
          python3 -m pip install "Pillow==10.2.0"
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Update recently watched anime
        run: python3 scripts/update_anime.py
        env:
          ANILIST_USER: Suzune889

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/anime
          if git diff --cached --quiet; then
            echo "No anime changes."
            exit 0
          fi
          git commit -m "chore: update anime list"
          git pull --rebase
          git push
