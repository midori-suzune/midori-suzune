name: Reset OpenQuiz daily stats

on:
  schedule:
    # 23:00 UTC = 06:00 next day in Vietnam
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Reset OpenQuiz daily study time
        run: node scripts/reset-openquiz-stats.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "OpenQuiz study time is already reset."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Reset OpenQuiz daily study time [skip ci]"
          git push origin HEAD:master
