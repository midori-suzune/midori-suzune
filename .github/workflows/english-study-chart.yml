name: Update English Study Chart

on:
  schedule:
    # 16:45 UTC = 23:45 Vietnam time
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read OpenQuiz activity and rebuild chart
        run: |
          git pull --ff-only origin master
          python3 scripts/update-english-study-chart.py

      - name: Commit updated chart if changed
        run: |
          git add assets/english-study-chart/data.json assets/english-study-chart/english-study-chart.svg
          if git diff --cached --quiet; then
            echo "English Study chart is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update English Study chart [skip ci]"
          git push origin HEAD:master
